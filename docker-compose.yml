version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nepse_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nepse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nepse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nepse_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nepse_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: PRODUCTION_SECRET_KEY_NEPSE_STOCK_INTELLIGENCE_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse_celery_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nepse_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: PRODUCTION_SECRET_KEY_NEPSE_STOCK_INTELLIGENCE_2026
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse_celery_beat
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nepse_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: PRODUCTION_SECRET_KEY_NEPSE_STOCK_INTELLIGENCE_2026
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nepse_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
